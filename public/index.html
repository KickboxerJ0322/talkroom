<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talkroom</title>
    <link rel="icon" type="image/png" href="/room_icon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="card join-card" aria-labelledby="app-title">
        <div class="brand-row">
          <img class="brand-icon" src="/room_icon.png" alt="Talkroom icon" />
          <div>
            <h1 id="app-title">Talkroom</h1>
          </div>
        </div>

        <form id="join-form" class="join-form" novalidate>
          <label class="field-label" for="roomId">ルームID</label>
          <input
            id="roomId"
            name="roomId"
            class="room-input"
            type="text"
            inputmode="text"
            maxlength="32"
            autocomplete="off"
            value="001"
            placeholder="001"
            aria-describedby="roomHelp"
          />
          <p id="roomHelp" class="help-text">
            3〜32文字の英数字、ハイフン、アンダースコアが使えます。
          </p>

          <label class="field-label" for="pin">PIN</label>
          <input
            id="pin"
            name="roomPin"
            class="room-input"
            type="text"
            inputmode="numeric"
            maxlength="8"
            autocomplete="one-time-code"
            pattern="[0-9]*"
            enterkeyhint="done"
            spellcheck="false"
            placeholder="1234"
            aria-describedby="pinHelp"
          />
          <p id="pinHelp" class="help-text">4〜8桁の数字を入力してください。</p>

          <button id="joinButton" class="primary-button" type="submit">通話ルームに参加</button>
        </form>
      </section>

      <section class="card status-card" aria-live="polite">
        <div class="room-row">
          <span class="room-label">ルーム</span>
          <span id="currentRoom" class="room-value">未参加</span>
        </div>

        <div class="status-block">
          <span id="statusDot" class="status-dot waiting"></span>
          <span id="statusText" class="status-text">待機中</span>
        </div>

        <p id="presenceText" class="presence-text">ルームに参加すると状況がここに表示されます。</p>
        <p id="errorText" class="error-text" hidden></p>

        <div id="videoStage" class="video-stage" hidden>
          <video id="remoteVideo" class="remote-video" autoplay playsinline hidden></video>
          <video id="localVideo" class="local-video" autoplay muted playsinline hidden></video>
          <div id="videoEmptyState" class="video-empty" hidden>カメラをONにすると映像が表示されます。</div>
        </div>

        <div class="timer" id="callTimer">00:00</div>

        <div class="media-status" aria-label="通話状態">
          <div class="media-pill" id="micStatus">マイク: ON</div>
          <div class="media-pill" id="speakerStatus">スピーカー: ON</div>
          <div class="media-pill" id="cameraStatus">カメラ: OFF</div>
        </div>

        <div class="actions">
          <button id="muteButton" class="secondary-button" type="button" disabled>マイクOFF</button>
          <button id="speakerButton" class="secondary-button" type="button" disabled>スピーカーOFF</button>
          <button id="cameraButton" class="secondary-button" type="button" disabled>カメラON</button>
          <button id="hangupButton" class="danger-button" type="button" disabled>通話を終了</button>
        </div>
      </section>

      <section class="card transcript-card" aria-live="polite">
        <div class="transcript-header">
          <div>
            <h2 class="section-title">リアルタイム会話ログ</h2>
          </div>
          <span id="transcriptStatus" class="transcript-status unsupported">文字起こし未設定</span>
        </div>

        <div class="transcript-actions">
          <button id="exportTranscriptButton" class="secondary-button" type="button">テキスト出力</button>
          <button id="resetAppButton" class="ghost-button" type="button">リセット</button>
        </div>

        <div id="transcriptTimeline" class="transcript-timeline" aria-label="会話ログ">
          <div class="empty-transcript" id="emptyTranscript">
            通話が始まると、ここに会話ログが表示されます。
          </div>
        </div>
      </section>
    </main>

    <audio id="remoteAudio" autoplay playsinline></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
